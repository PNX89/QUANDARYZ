<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 450" width="842" height="450" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace' font-size="13">
<style>
text{fill:#d6d5ce;white-space:pre;dominant-baseline:middle}
text.cmd{fill:#d9a441;font-weight:600}
@keyframes l0{0%,0.000%{opacity:0}0.000%,100%{opacity:1}}@keyframes l1{0%,1.017%{opacity:0}1.027%,100%{opacity:1}}@keyframes l2{0%,2.044%{opacity:0}2.054%,100%{opacity:1}}@keyframes l3{0%,3.071%{opacity:0}3.081%,100%{opacity:1}}@keyframes l4{0%,4.098%{opacity:0}4.108%,100%{opacity:1}}@keyframes l5{0%,5.125%{opacity:0}5.135%,100%{opacity:1}}@keyframes l6{0%,6.152%{opacity:0}6.162%,100%{opacity:1}}@keyframes l7{0%,7.180%{opacity:0}7.190%,100%{opacity:1}}@keyframes l8{0%,8.207%{opacity:0}8.217%,100%{opacity:1}}@keyframes l9{0%,9.234%{opacity:0}9.244%,100%{opacity:1}}@keyframes l10{0%,10.261%{opacity:0}10.271%,100%{opacity:1}}@keyframes l11{0%,11.288%{opacity:0}11.298%,100%{opacity:1}}@keyframes l12{0%,12.315%{opacity:0}12.325%,100%{opacity:1}}@keyframes l13{0%,13.342%{opacity:0}13.352%,100%{opacity:1}}@keyframes l14{0%,14.369%{opacity:0}14.379%,100%{opacity:1}}@keyframes l15{0%,15.396%{opacity:0}15.406%,100%{opacity:1}}@keyframes l16{0%,16.423%{opacity:0}16.433%,100%{opacity:1}}@keyframes l17{0%,17.450%{opacity:0}17.460%,100%{opacity:1}}@keyframes l18{0%,18.477%{opacity:0}18.487%,100%{opacity:1}}@keyframes l19{0%,19.504%{opacity:0}19.514%,100%{opacity:1}}@keyframes l20{0%,20.532%{opacity:0}20.542%,100%{opacity:1}}
</style>
<rect width="842" height="450" rx="8" fill="#14141a"/>
<circle cx="20" cy="15" r="5" fill="#e05a51"/><circle cx="38" cy="15" r="5" fill="#e0b341"/><circle cx="56" cy="15" r="5" fill="#57b95a"/>
<text x="18" y="34" class="cmd" style="animation:l0 5355ms steps(1,end) infinite">$ npm run demo</text><text x="18" y="53" style="animation:l1 5355ms steps(1,end) infinite"></text><text x="18" y="72" style="animation:l2 5355ms steps(1,end) infinite">A trader narrows the account filter from the whole book to one desk.</text><text x="18" y="91" style="animation:l3 5355ms steps(1,end) infinite">The rows come from one endpoint and the exposure figure in the header from another.</text><text x="18" y="110" style="animation:l4 5355ms steps(1,end) infinite"></text><text x="18" y="129" style="animation:l5 5355ms steps(1,end) infinite">  guarded     1 distinct screen across 17 distinct orderings in 40 runs</text><text x="18" y="148" style="animation:l6 5355ms steps(1,end) infinite">  unguarded   4 distinct screens across 17 distinct orderings in 40 runs</text><text x="18" y="167" style="animation:l7 5355ms steps(1,end) infinite"></text><text x="18" y="186" style="animation:l8 5355ms steps(1,end) infinite">  The guarded wiring applies the flag react.dev documents three times. It works.</text><text x="18" y="205" style="animation:l9 5355ms steps(1,end) infinite">  Without it, which screen the trader gets is decided by the network.</text><text x="18" y="224" style="animation:l10 5355ms steps(1,end) infinite"></text><text x="18" y="243" style="animation:l11 5355ms steps(1,end) infinite">  One of them reads: 128 positions, 4.82m net</text><text x="18" y="262" style="animation:l12 5355ms steps(1,end) infinite">  above 41 rows. Both figures were computed and sent by the server, so there is no</text><text x="18" y="281" style="animation:l13 5355ms steps(1,end) infinite">  spinner, no error and nothing stale in the sense anybody checks for.</text><text x="18" y="300" style="animation:l14 5355ms steps(1,end) infinite">  Reproduce it with: 1:(&quot;all&quot;) then 4:(&quot;desk&quot;) then 3:(&quot;desk&quot;) then 2:(&quot;all&quot;)...</text><text x="18" y="319" style="animation:l15 5355ms steps(1,end) infinite"></text><text x="18" y="338" style="animation:l16 5355ms steps(1,end) infinite">And a second property, on a screen that never tears at all:</text><text x="18" y="357" style="animation:l17 5355ms steps(1,end) infinite"></text><text x="18" y="376" style="animation:l18 5355ms steps(1,end) infinite">  the risk panel settles the same way every time, and renders &quot;Within limits&quot;</text><text x="18" y="395" style="animation:l19 5355ms steps(1,end) infinite">  over a response about only the limits it asked about. No delivered value accounts</text><text x="18" y="414" style="animation:l20 5355ms steps(1,end) infinite">  for that phrase. It was composed in the browser out of the absence of a breach.</text>
</svg>
