name: CI

# Nothing here needs a credential and nothing here reaches a cloud account.
#
# `npm test` runs every subject in happy-dom, installs no browser and reaches nothing outside
# npm. The same subjects run again in real Chromium in their own job, because a repository whose
# claim is about what a browser does has demonstrated it about a simulation until it does.
#
# NO `schedule:` in any workflow here. Third-party actions are pinned by commit.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: types and the subjects, in a simulated DOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: one type checker, and prove it
        # `npm ls typescript` is the check a reviewer would run, so it is the check that runs
        # here. A repository whose subject is judgement cannot carry two type checkers.
        run: |
          npm ls typescript
          test "$(npm ls typescript --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0));console.log(d.dependencies.typescript.version)')" = "6.0.3"
      - run: npm run typecheck
      - run: npm test
      - name: run the demo exactly as the README tells a reader to
        run: npm run demo
      - name: capture what it printed
        run: node scripts/capture-evidence.mjs
      - name: fail if any measured cardinality has changed
        run: |
          # The table is the exhibit, so a wiring whose count moves is a red build that names
          # which one moved rather than a number nobody was watching.
          git status --porcelain docs/evidence
          git diff --exit-code -- docs/evidence/wirings.json docs/evidence/demo.txt
          test -z "$(git status --porcelain docs/evidence/wirings.json docs/evidence/demo.txt)"

  # The same counterexample, in a real browser. Its own job because it installs a browser, and
  # `npm test` must stay the command that installs none and reaches nothing outside npm.
  #
  # CHROMIUM ONLY, and the headless shell: 82 MB against the several hundred the default set
  # pulls. One engine answers whether the result survives leaving the simulation; three would be
  # answering a question about engine differences that nothing here investigates.
  browser:
    name: the counterexample, in real Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
